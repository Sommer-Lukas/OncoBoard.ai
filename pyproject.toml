[project]
name = "oncoboard-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "google-genai>=1.0.0",
    "httpx",
    "pandas",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "asyncpg",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
